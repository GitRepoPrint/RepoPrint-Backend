name: Backend CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'dev' && github.ref_name != 'main' }}

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: repoprint
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: repoprint_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U repoprint"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: repoprint_test
      DB_USER: repoprint
      DB_PASSWORD: ci-password

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv python install 3.14
      - run: uv sync --frozen --python 3.14

      - run: uvx ruff@0.17.5 check . --select E9,F63,F7,F82

      - run: uv run python -c "import main"

      - run: uv run pytest -rs

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - run: uv export --frozen --no-dev --no-emit-project -o requirements-audit.txt
      - run: uvx pip-audit -r requirements-audit.txt --disable-pip

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gacts/gitleaks@v1

  docker:
    runs-on: ubuntu-latest
    needs: tests

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: repoprint-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - run: docker run --rm repoprint-backend:ci python -c "import main"

      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: repoprint-backend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Log in to GHCR
        if: github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'main')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        if: github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'main')
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=ref,event=branch

      - name: Push image
        if: github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'main')
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha